name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ master, cursor/v2-verification-pass-1f1d ]
    paths:
      - 'appdb/**'
      - 'Widgets/**'
      - 'appdb.xcodeproj/**'
      - '.github/workflows/build-unsigned-ipa.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build archive without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project appdb.xcodeproj \
            -scheme appdb \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/appdb.xcarchive" \
            archive \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/appdb.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry appdb-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appdb-unsigned-ipa
          path: ${{ runner.temp }}/appdb-unsigned.ipa
          if-no-files-found: error
