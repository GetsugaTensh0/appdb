name: Finish v1.7 dead-UI cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - cleanup/remove-dead-v1.6-ui
    paths:
      - .github/workflows/finish-v17-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-dead-v1.6-ui
      - name: Apply remaining cleanup edits
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("appdb/Startup/Extensions.swift")
          t = p.read_text()
          for line in [
              '        case "ERROR_UNKNOWN_VOUCHER_PARTNER": return "Unknown voucher partner.".localized()\n',
              '        case "INVALID_VOUCHER": return "Invalid voucher.".localized()\n',
              '        case "VOUCHER_ALREADY_USED": return "Voucher already used.".localized()\n',
          ]:
              t = t.replace(line, "")
          p.write_text(t)

          p = Path("appdb.xcodeproj/project.pbxproj")
          drop = {
              "		8176EFA92785E5B5004545DA /* IPACache.swift in Sources */ = {isa = PBXBuildFile; fileRef = 8176EFA82785E5B5004545DA /* IPACache.swift */; };",
              "		81F0C0AB2353BF5400604A10 /* API+Voucher.swift in Sources */ = {isa = PBXBuildFile; fileRef = 81F0C0AA2353BF5400604A10 /* API+Voucher.swift */; };",
              "		8176EFA82785E5B5004545DA /* IPACache.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = IPACache.swift; sourceTree = \"<group>\"; };",
              "		81F0C0AA2353BF5400604A10 /* API+Voucher.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = \"API+Voucher.swift\"; sourceTree = \"<group>\"; };",
              "				8176EFA82785E5B5004545DA /* IPACache.swift */,",
              "				81F0C0AA2353BF5400604A10 /* API+Voucher.swift */,",
              "				8176EFA92785E5B5004545DA /* IPACache.swift in Sources */,",
              "				81F0C0AB2353BF5400604A10 /* API+Voucher.swift in Sources */,",
          }
          lines = [ln for ln in p.read_text().splitlines(True) if ln.rstrip("\n") not in drop]
          p.write_text("".join(lines))

          p = Path("appdb/Tabs/Downloads/Library/Library+Extension.swift")
          t = p.read_text()
          t = t.replace(
              'secondaryText: "Use iTunes File Sharing or import them from other apps".localized()',
              'secondaryText: "Add IPAs via Files/Share Sheet, or download one from the Downloading tab".localized()',
          )
          t = t.replace(
              'secondaryText: "This is your personal IPA library! Apps you upload over time will appear here".localized()',
              'secondaryText: "Upload a local IPA to your personal library — it will show up here for install".localized()',
          )
          p.write_text(t)

          p = Path("appdb/en.lproj/Localizable.strings")
          t = p.read_text()
          for old in [
              '"Install an app to see signing progress here" = "Install an app to see signing progress here";\n',
              '"This feature is no longer available" = "This feature is no longer available";\n',
              '"Voucher activation is no longer available in API v1.7. Use subscription options instead." = "Voucher activation is no longer available in API v1.7. Use subscription options instead.";\n',
              '"Voucher validation is no longer available in API v1.7. Use subscription options instead." = "Voucher validation is no longer available in API v1.7. Use subscription options instead.";\n',
              '"Email link code is no longer available in API v1.7. Use the link code shown in Settings instead." = "Email link code is no longer available in API v1.7. Use the link code shown in Settings instead.";\n',
          ]:
              t = t.replace(old, "")
          insert = (
              '"Install or reinstall an app to track signing and install progress here" = "Install or reinstall an app to track signing and install progress here";\n'
              '"Tap + to download an IPA from a URL, or install an app to see progress here" = "Tap + to download an IPA from a URL, or install an app to see progress here";\n'
              '"Add IPAs via Files/Share Sheet, or download one from the Downloading tab" = "Add IPAs via Files/Share Sheet, or download one from the Downloading tab";\n'
              '"Upload a local IPA to your personal library — it will show up here for install" = "Upload a local IPA to your personal library — it will show up here for install";\n'
              '"Use Revoked Certificates" = "Use Revoked Certificates";\n'
              '"Device Tools" = "Device Tools";\n'
              '"Libraries & Status" = "Libraries & Status";\n'
              '"Notifications" = "Notifications";\n'
              '"Install History lists previous installs from this device via API v1.7." = "Install History lists previous installs from this device via API v1.7.";\n'
              '"No install history found" = "No install history found";\n'
              '"Install History" = "Install History";\n'
              '"Install History Items" = "Install History Items";\n'
              '"Install history for current device" = "Install history for current device";\n'
          )
          anchor = '"Command cancelled" = "Command cancelled";\n'
          if '"Install or reinstall an app' not in t:
              if anchor not in t:
                  raise SystemExit("Command cancelled anchor missing")
              t = t.replace(anchor, anchor + insert)
          p.write_text(t)

          Path(".github/workflows/finish-v17-cleanup.yml").unlink(missing_ok=True)
          print("edits applied")
          PY
      - name: Commit applied cleanup
        run: |
          git config user.name "GetsugaTensh0"
          git config user.email "155216087+GetsugaTensh0@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Finish v1.7 dead-UI cleanup: pbxproj, Extensions, Library, strings"
          git push
